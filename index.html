<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrii Store </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-dark custom-navbar sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand nav-block logo-block" href="#">
                &lt;&gt; Andrii <span class="d-none d-sm-inline" style="color: var(--text-main);">Store</span>
            </a>
            
            <div class="d-flex">
                <a href="#" class="nav-link nav-block text-accent">cart (0)</a>
            </div>
        </div>
    </nav>

    <main class="container my-4 my-md-5 pt-2 pt-md-4">
        <div class="text-center">
            <h2 class="section-title">featured_products_v1.2</h2>
        </div>

        <div class="row g-3 g-md-4 justify-content-center">
            <div class="col-12 col-sm-6 col-lg-4">
                <div class="product-card h-100">
                    <div class="product-img-container">
                        <img src="https://images.unsplash.com/photo-1587829741301-dc798b83aca2?auto=format&fit=crop&w=500&q=80" class="card-img-top" alt="Keyboard">
                    </div>
                    <div class="product-card-body">
                        <h4 class="product-title">mechanical_keyboard_rgb</h4>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="product-price">120.00$</span>
                            <button class="btn btn-custom">add</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <div class="product-card h-100">
                    <div class="product-img-container">
                        <img src="https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?auto=format&fit=crop&w=500&q=80" class="card-img-top" alt="Monitor">
                    </div>
                    <div class="product-card-body">
                        <h4 class="product-title">curved_monitor_144hz</h4>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="product-price">350.00$</span>
                            <button class="btn btn-custom">add</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <div class="product-card h-100">
                    <div class="product-img-container">
                        <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=500&q=80" class="card-img-top" alt="Mouse">
                    </div>
                    <div class="product-card-body">
                        <h4 class="product-title">gaming_mouse_wireless</h4>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="product-price">85.00$</span>
                            <button class="btn btn-custom">add</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="container text-center my-5 pt-5">
        <p class="text-muted small">&copy; 2026 Andrii E-com System.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
